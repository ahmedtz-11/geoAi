# GeoAI behind nginx. One application serves everything, so nginx only has to pass requests to it.
#
# Copy to /etc/nginx/sites-available/geoai, then:
#   ln -s /etc/nginx/sites-available/geoai /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d geoai.example.com        (adds the TLS block and the redirect)

upstream geoai { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name geoai.example.com;

    client_max_body_size 200M;          # survey files are large; raise it if yours are larger
    proxy_read_timeout 600s;            # a satellite fetch or an IP inversion can take minutes
    proxy_send_timeout 600s;

    location / {
        proxy_pass         http://geoai;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Pictures and downloads are files; let nginx send them without buffering through Python twice.
    location /app/fig/ {
        proxy_pass         http://geoai;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
    }

    access_log /var/log/nginx/geoai.access.log;
    error_log  /var/log/nginx/geoai.error.log;
}
