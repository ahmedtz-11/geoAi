# GeoAI: the portal on /, the Streamlit app on /app, nothing reaching the app unsigned-in.
#
# Copy to /etc/nginx/sites-available/geoai, then:
#   ln -s /etc/nginx/sites-available/geoai /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d geoai.example.com        (adds the TLS block and the redirect)

upstream geoai_portal { server 127.0.0.1:8000; }
upstream geoai_app    { server 127.0.0.1:8501; }

server {
    listen 80;
    server_name geoai.example.com;

    client_max_body_size 200M;          # survey files are large; raise if yours are larger
    proxy_read_timeout 600s;            # a magnetic inversion or a satellite fetch can take minutes
    proxy_send_timeout 600s;

    # ---------------- the portal: public site, accounts, admin, payment webhooks
    location / {
        proxy_pass         http://geoai_portal;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------------- the gate, asked about on every request to /app. Not reachable from outside.
    location = /_gate/check {
        internal;
        proxy_pass              http://geoai_portal/_gate/check;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        Host $host;
    }

    # ---------------- the Streamlit app
    location /app/ {
        auth_request      /_gate/check;
        auth_request_set  $geoai_token $upstream_http_x_geoai_token;
        error_page        401 = @needs_signin;

        # The browser's own version of this header is thrown away and replaced: proxy_set_header
        # overwrites, so a forged X-GeoAI-Token never reaches Streamlit. The token is signed as well,
        # so Streamlit would not believe one that arrived another way.
        proxy_set_header  X-GeoAI-Token $geoai_token;

        proxy_pass        http://geoai_app/;
        proxy_http_version 1.1;
        proxy_set_header  Upgrade $http_upgrade;          # Streamlit talks over a websocket
        proxy_set_header  Connection "upgrade";
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_buffering   off;
    }

    location @needs_signin { return 302 /login?next=/app/; }

    location /static/ {
        proxy_pass http://geoai_portal;
        expires 7d;
    }
}
