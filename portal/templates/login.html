{% extends "base.html" %}
{% block title %}Sign in · {{ BRAND }}{% endblock %}
{% block body %}
<h1>Sign in</h1>
<div class="card" style="max-width:420px">
<form method="post">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ email }}" required autofocus autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required autocomplete="current-password">
  <label class="small" style="margin-top:.8rem;font-weight:400">
    <input type="checkbox" name="remember" style="width:auto"> Keep me signed in</label>
  <p><button class="btn" type="submit">Sign in</button></p>
</form>
<p class="small muted">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
</div>
{% endblock %}
